dependencies = [
    "fastapi==0.140.13",
    "uvicorn==0.52.0",
    "sqlalchemy==2.0.51",
    "pydantic-settings==2.14.2",
    "aiohttp>=3.14.3",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.12",
